name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "img/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: geoapp

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # clean removes the old jar committed under target/, so the Dockerfile
      # copies exactly one jar
      - name: Build jar
        run: mvn -B clean package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::540738452774:role/github-actions-geoapp-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          {
            echo "### Pushed image"
            echo '```'
            echo "$IMAGE:$TAG"
            echo '```'
            echo "Deploy it with:"
            echo '```'
            echo "helm upgrade --install geoapp ./geoapp --set image.tag=$TAG --wait"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"