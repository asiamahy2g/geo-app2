name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "img/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: geoapp

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # clean removes the old jar committed under target/, so the Dockerfile
      # copies exactly one jar
      - name: Build jar
        run: mvn -B clean package

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::540738452774:role/github-actions-geoapp-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### Pushed image"
            echo '```'
            echo "$IMAGE:$TAG"
            echo '```'
            echo "Approve the deploy job to roll it out to EKS."
          } >> "$GITHUB_STEP_SUMMARY"

  # Waits for approval in the geoapp-prod environment, then upgrades the cluster.
  # Skips cleanly if the cluster is not running.
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
