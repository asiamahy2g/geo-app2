<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">Hospital logo</title>
  <!-- outer ring -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" stroke="#0d47a1" stroke-width="6"/>
  <!-- building -->
  <rect x="30" y="38" width="60" height="50" rx="4" fill="#1565c0"/>
  <rect x="44" y="26" width="32" height="16" rx="3" fill="#1565c0"/>
  <!-- medical cross -->
  <rect x="53" y="44" width="14" height="34" rx="2" fill="#ffffff"/>
  <rect x="43" y="54" width="34" height="14" rx="2" fill="#ffffff"/>
  <!-- door -->
  <rect x="54" y="80" width="12" height="8" fill="#0d47a1"/>
  <!-- ground -->
  <rect x="24" y="88" width="72" height="4" rx="2" fill="#0d47a1"/>
</svg>
